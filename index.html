<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Mobile responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Khatijatul Kubra | Software Engineer & Web Developer</title>

    <meta name="description"
          content="Portfolio of Khatijatul Kubra - Software Engineer, Web Developer and Data Science Engineering student.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f4ee;
            color: #171717;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ================= NAVBAR ================= */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(247, 244, 238, 0.97);
            border-bottom: 1px solid #ddd5ca;
        }

        .nav-container {
            max-width: 1100px;
            margin: auto;
            padding: 18px 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            color: #171717;
        }

        .logo span {
            color: #c65d45;
        }

        .nav-links {
            display: flex;
            gap: 28px;
            list-style: none;
        }

        .nav-links a {
            font-size: 14px;
            font-weight: 600;
            color: #444;
        }

        .nav-links a:hover {
            color: #c65d45;
        }

        /* ================= GENERAL ================= */

        section {
            max-width: 1100px;
            margin: auto;
            padding: 90px 25px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 45px;
        }

        .section-title h2 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .section-title p {
            color: #777;
        }

        /* ================= HERO ================= */

        .hero {
            min-height: 650px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 80px 25px;
        }

        .hero-content {
            max-width: 850px;
        }

        .hero-small {
            color: #c65d45;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 18px;
        }

        .hero h1 {
            font-size: 64px;
            line-height: 1.1;
            margin-bottom: 18px;
        }

        .hero h1 span {
            color: #c65d45;
        }

        .hero h2 {
            font-size: 27px;
            margin-bottom: 20px;
            color: #333;
        }

        .hero-description {
            max-width: 700px;
            margin: auto;
            color: #666;
            font-size: 17px;
        }

        .hero-buttons {
            margin-top: 30px;

            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 13px 22px;
            border-radius: 8px;
            font-weight: bold;
            border: 1px solid #c65d45;
            transition: 0.2s;
        }

        .btn-primary {
            background: #c65d45;
            color: white;
        }

        .btn-primary:hover {
            background: #a94834;
        }

        .btn-secondary {
            color: #c65d45;
            background: white;
        }

        .btn-secondary:hover {
            background: #c65d45;
            color: white;
        }

        /* ================= ABOUT ================= */

        .about-box {
            background: white;
            border: 1px solid #e1d9ce;
            border-radius: 16px;
            padding: 35px;
            max-width: 900px;
            margin: auto;
            box-shadow: 0 8px 30px rgba(0,0,0,0.05);
        }

        .about-box p {
            color: #555;
            font-size: 17px;
            margin-bottom: 18px;
        }

        /* ================= SKILLS ================= */

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .skill {
            background: white;
            border: 1px solid #e1d9ce;
            border-radius: 12px;
            padding: 22px;
            text-align: center;
            font-weight: bold;
            color: #333;
            box-shadow: 0 5px 20px rgba(0,0,0,0.04);
        }

        .skill:hover {
            border-color: #c65d45;
            color: #c65d45;
        }

        /* ================= PROJECTS ================= */

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .project-card {
            background: white;
            border: 1px solid #e1d9ce;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.05);
        }

        .project-number {
            color: #c65d45;
            font-weight: bold;
            font-size: 14px;
        }

        .project-card h3 {
            font-size: 25px;
            margin: 10px 0;
        }

        .project-card p {
            color: #666;
            margin-bottom: 18px;
        }

        .tech {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .tech span {
            background: #f3eee7;
            color: #555;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .project-link {
            color: #c65d45;
            font-weight: bold;
        }

        .project-link:hover {
            text-decoration: underline;
        }

        /* ================= EDUCATION ================= */

        .education-card {
            background: white;
            border-left: 5px solid #c65d45;
            padding: 30px;
            border-radius: 12px;
            max-width: 850px;
            margin: auto;
            box-shadow: 0 8px 30px rgba(0,0,0,0.05);
        }

        .education-card h3 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .education-card h4 {
            color: #c65d45;
            margin-bottom: 12px;
        }

        .education-card p {
            color: #666;
        }

        /* ================= CONTACT ================= */

        .contact-box {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .contact-card {
            background: white;
            border: 1px solid #e1d9ce;
            border-radius: 14px;
            padding: 28px;
            text-align: center;
        }

        .contact-card .icon {
            font-size: 30px;
            margin-bottom: 12px;
        }

        .contact-card h3 {
            margin-bottom: 8px;
        }

        .contact-card a {
            color: #c65d45;
            font-weight: bold;
            word-break: break-word;
        }

        /* ================= GITHUB CTA ================= */

        .github-section {
            background: #171717;
            color: white;
            max-width: none;
            text-align: center;
        }

        .github-inner {
            max-width: 900px;
            margin: auto;
        }

        .github-section h2 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .github-section p {
            color: #ccc;
            margin-bottom: 25px;
        }

        .github-button {
            display: inline-block;
            background: #c65d45;
            color: white;
            padding: 14px 25px;
            border-radius: 8px;
            font-weight: bold;
        }

        /* ================= FOOTER ================= */

        footer {
            background: #111;
            color: #aaa;
            text-align: center;
            padding: 25px;
            font-size: 14px;
        }

        footer strong {
            color: white;
        }

                gap: 15px;
