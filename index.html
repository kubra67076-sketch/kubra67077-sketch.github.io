<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Khatijatul Kubra | Software Engineer & Web Developer</title>

    <meta name="description"
          content="Khatijatul Kubra - Software Engineer, Web Developer and Data Science Engineering student.">

    <meta name="author" content="Khatijatul Kubra">

    <style>

        /* =========================
           BASIC RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        :root {
            --bg: #f7f4ee;
            --bg2: #eee9df;
            --card: #ffffff;
            --text: #171717;
            --muted: #696969;
            --accent: #c65d45;
            --accent-dark: #9e4533;
            --border: #ddd6ca;
            --shadow: 0 18px 50px rgba(0,0,0,0.08);
        }

        body.dark {
            --bg: #101010;
            --bg2: #191919;
            --card: #1d1d1d;
            --text: #f4f4f4;
            --muted: #b8b8b8;
            --accent: #e7775d;
            --accent-dark: #ff947b;
            --border: #333333;
            --shadow: 0 18px 50px rgba(0,0,0,0.35);
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            transition: 0.3s ease;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            font-family: inherit;
        }

        .container {
            width: min(1150px, 90%);
            margin: auto;
        }


        /* =========================
           SCROLL BAR
        ========================= */

        #progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            width: 0;
            background: var(--accent);
            z-index: 9999;
        }


        /* =========================
           NAVBAR
        ========================= */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(247,244,238,0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
        }

        body.dark header {
            background: rgba(16,16,16,0.9);
        }

        nav {
            min-height: 75px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .logo span {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 27px;
            list-style: none;
        }

        .nav-links a {
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 700;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-btn,
        .menu-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            font-size: 1rem;
        }

        .menu-btn {
            display: none;
            border-radius: 10px;
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: calc(100vh - 75px);
            display: flex;
            align-items: center;
            padding: 80px 0;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.3fr 0.7fr;
            gap: 60px;
            align-items: center;
        }

        .eyebrow {
            color: var(--accent);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
            margin-bottom: 18px;
        }

        .hero h1 {
            font-size: clamp(3.2rem, 7vw, 6rem);
            line-height: 0.95;
            letter-spacing: -5px;
            margin-bottom: 25px;
        }

        .hero h1 span {
            color: var(--accent);
        }

        .typing {
            font-size: clamp(1.25rem, 3vw, 1.7rem);
            font-weight: 800;
            margin-bottom: 20px;
            min-height: 42px;
        }

        .hero-description {
            max-width: 680px;
            color: var(--muted);
            font-size: 1.05rem;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 13px 21px;
            border-radius: 11px;
            border: 1px solid var(--border);
            font-weight: 800;
            transition: 0.3s;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-dark);
            transform: translateY(-3px);
        }

        .btn-outline:hover {
            color: var(--accent);
            border-color: var(--accent);
            transform: translateY(-3px);
        }

        .hero-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 35px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: var(--shadow);
            transform: rotate(2deg);
        }

        .hero-card-inner {
            transform: rotate(-2deg);
        }

        .profile {
            width: 160px;
            height: 160px;
            margin: auto auto 25px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--accent), #e6a18d);
            color: white;
            font-size: 3.5rem;
            font-weight: 900;
            box-shadow: 0 15px 35px rgba(198,93,69,0.25);
        }

        .hero-card h3 {
            font-size: 1.35rem;
        }

        .hero-card p {
            color: var(--muted);
        }


        /* =========================
           SECTION
        ========================= */

        section {
            padding: 100px 0;
        }

        .heading {
            margin-bottom: 45px;
        }

        .number {
            color: var(--accent);
            font-size: 0.8rem;
            letter-spacing: 2px;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .heading h2 {
            font-size: clamp(2.2rem, 5vw, 3.6rem);
            line-height: 1;
            letter-spacing: -2px;
        }

        .heading p {
            color: var(--muted);
            margin-top: 15px;
            max-width: 700px;
        }


        /* =========================
           ABOUT
        ========================= */

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
        }

        .about-text {
            color: var(--muted);
            font-size: 1.03rem;
        }

        .about-text p {
            margin-bottom: 18px;
        }

        .info-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 30px;
            box-shadow: var(--shadow);
        }

        .info-card h3 {
            margin-bottom: 18px;
        }

        .info-list {
            list-style: none;
        }

        .info-list li {
            padding: 13px 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .info-list li:last-child {
            border-bottom: none;
        }

        .label {
            color: var(--muted);
        }

        .value {
            font-weight: 800;
            text-align: right;
        }


        /* =========================
           STATS
        ========================= */

        .stats {
            margin-top: 45px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .stat {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 25px;
            text-align: center;
        }

        .stat h3 {
            color: var(--accent);
            font-size: 2rem;
        }

        .stat p {
            color: var(--muted);
            font-size: 0.9rem;
        }


        /* =========================
           SKILLS
        ========================= */

        .skills {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .skill {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 22px;
            transition: 0.3s;
        }

        .skill:hover {
            transform: translateY(-7px);
            border-color: var(--accent);
            box-shadow: var(--shadow);
        }

        .skill-icon {
            font-size: 1.7rem;
            margin-bottom: 10px;
        }

        .skill h3 {
            margin-bottom: 5px;
        }

        .skill p {
            color: var(--muted);
            font-size: 0.85rem;
        }


        /* =========================
           PROJECTS
        ========================= */

        .projects {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .project {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 30px;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }

        .project:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow);
        }

        .project-number {
            color: var(--accent);
            font-weight: 900;
            margin-bottom: 12px;
        }

        .project h3 {
            font-size: 1.45rem;
            margin-bottom: 10px;
        }

        .project p {
            color: var(--muted);
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 20px;
        }

        .tag {
            padding: 6px 10px;
            border-radius: 50px;
            background: var(--bg2);
            border: 1px solid var(--border);
            font-size: 0.75rem;
            font-weight: 700;
        }

        .project-link {
            color: var(--accent);
            font-weight: 900;
        }


        /* =========================
           EDUCATION
        ========================= */

        .timeline {
            max-width: 850px;
            position: relative;
        }

        .timeline::before {
            content: "";
            position: absolute;
            left: 9px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--border);
        }

        .timeline-item {
            position: relative;
            padding-left: 45px;
            margin-bottom: 45px;
        }

        .dot {
            position: absolute;
            left: 2px;
            top: 5px;
            width: 17px;
            height: 17px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 3px var(--bg);
        }

        .timeline-item h3 {
            font-size: 1.35rem;
            margin-bottom: 5px;
        }

        .institution {
            color: var(--accent);
            font-weight: 800;
            margin-bottom: 8px;
        }

        .timeline-item p {
            color: var(--muted);
        }


        /* =========================
           GITHUB CTA
        ========================= */

        .github-box {
            background: var(--text);
            color: var(--bg);
            padding: 55px;
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
        }

        .github-box h2 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .github-box p {
            opacity: 0.7;
            max-width: 600px;
        }

        .github-box .btn {
            background: var(--bg);
            color: var(--text);
            border-color: var(--bg);
            white-space: nowrap;
        }

        .github-box .btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }


        /* =========================
           CONTACT
        ========================= */

        .contacts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .contact {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 30px;
            transition: 0.3s;
        }

        .contact:hover {
            transform: translateY(-7px);
            border-color: var(--accent);
            box-shadow: var(--shadow);
        }

        .contact-icon {
            font-size: 2rem;
            margin-bottom: 12px;
        }

        .contact h3 {
            margin-bottom: 7px;
        }

        .contact p {
            color: var(--muted);
            word-break: break-word;
            font-size: 0.9rem;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            border-top: 1px solid var(--border);
            padding: 35px 0;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .footer p {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .socials {
            display: flex;
            gap: 10px;
        }

        .socials a {
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 50%;
            transition: 0.3s;
            font-weight: 800;
        }

        .socials a:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }


        /* =========================
           BACK TO TOP
        ========================= */

        #top {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            background: var(--accent);
            color: white;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            z-index: 999;
            font-size: 1.1rem;
        }

        #top.show {
            opacity: 1;
            pointer-events: auto;
        }


        /* =========================
           ANIMATION
        ========================= */

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: 0.8s ease;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .hero-grid,
            .about-grid {
                grid-template-columns: 1fr;
            }

            .hero-card {
                max-width: 430px;
                margin: auto;
            }

            .skills {
                grid-template-columns: repeat(2, 1fr);
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .contacts {
                grid-template-columns: 1fr;
            }

            .github-box {
                flex-direction: column;
                align-items: flex-start;
            }
        }


        @media (max-width: 700px) {

            .nav-links {
                display: none;
                position: absolute;
                left: 0;
                right: 0;
                top: 75px;
                background: var(--bg);
                border-bottom: 1px solid var(--border);
                padding: 25px;
                flex-direction: column;
                gap: 20px;
            }

            .nav-links.open {
                display: flex;
            }

            .menu-btn {
                display: block;
            }

            section {
                padding: 75px 0;
            }

            .hero {
                padding: 60px 0;
            }

            .hero h1 {
                letter-spacing: -3px;
            }

            .projects {
                grid-template-columns: 1fr;
            }

            .github-box {
                padding: 35px 25px;
            }

            .footer {
                flex-direction: column;
                text-align: center;
            }
        }


        @media (max-width: 500px) {

            .skills {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .info-list li {
                flex-direction: column;
            }

            .value {
                text-align: left;
            }
        }

    </style>
</head>
